plugins {
    id 'com.android.application'
}

android {
    namespace 'kz.almas.rootcleaner'
    compileSdk 35

    defaultConfig {
        applicationId "kz.almas.rootcleaner"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
