name: ALMAS CONNECT APK + EXE
on:
  push:
    branches: [almas-connect-v0]
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ALMAS-CONNECT
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: |
          flutter create --platforms=android --project-name almas_connect "$RUNNER_TEMP/almas_scaffold"
          cp -R "$RUNNER_TEMP/almas_scaffold/android" ./android
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/src/main/AndroidManifest.xml')
          s = p.read_text()
          s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET" />\n    <application android:usesCleartextTraffic="true"', 1)
          p.write_text(s)
          PY
      - name: Dependencies and analysis
        run: |
          flutter pub get
          flutter analyze lib
      - name: Build Android APK
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS-CONNECT-Android-APK
          path: ALMAS-CONNECT/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ALMAS-CONNECT
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows platform files
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter create --platforms=windows --project-name almas_connect "$env:RUNNER_TEMP\almas_scaffold"
          Copy-Item "$env:RUNNER_TEMP\almas_scaffold\windows" .\windows -Recurse
      - name: Dependencies and analysis
        shell: pwsh
        run: |
          flutter pub get
          flutter analyze lib
      - name: Build Windows EXE
        run: flutter build windows --release
      - name: Pack Windows app (EXE + DLL + data)
        shell: pwsh
        run: Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath "ALMAS-CONNECT-Windows.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: ALMAS-CONNECT-Windows-EXE-ZIP
          path: ALMAS-CONNECT/ALMAS-CONNECT-Windows.zip
          if-no-files-found: error
