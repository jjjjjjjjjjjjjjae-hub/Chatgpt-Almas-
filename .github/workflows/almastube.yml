name: Build AlmasTube APK

on:
  push:
    branches: [ almastube ]
    paths:
      - 'almastube-app/**'
      - '.github/workflows/almastube.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: gradle -p almastube-app assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlmasTube-APK
          path: almastube-app/app/build/outputs/apk/debug/app-debug.apk
