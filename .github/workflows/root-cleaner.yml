name: Build Almas Root Cleaner APK
on:
  workflow_dispatch:
  push:
    branches: [ almas-root-cleaner ]
    paths:
      - 'root-cleaner/**'
      - '.github/workflows/root-cleaner.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build APK
        working-directory: root-cleaner
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: AlmasRootCleaner-APK
          path: root-cleaner/app/build/outputs/apk/debug/app-debug.apk
