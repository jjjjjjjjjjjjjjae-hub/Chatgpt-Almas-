name: Build ONAY Demo APK
on:
  push:
    branches:
      - onay-demo-apk
    paths:
      - 'onay-android/**'
      - '.github/workflows/onay-demo-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Assemble Android debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK platform 35
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build unsigned-debug APK
        run: gradle --no-daemon -p onay-android :app:assembleDebug
      - name: Rename APK
        run: cp onay-android/app/build/outputs/apk/debug/app-debug.apk ONAY-UI-Demo-v9.apk
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: ONAY-UI-Demo-v9-APK
          path: ONAY-UI-Demo-v9.apk
          retention-days: 30
          if-no-files-found: error
